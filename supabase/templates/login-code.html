<!doctype html>
<html lang="tr">
  <body style="margin:0;padding:0;background:#FBF9F8;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1E1A22">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FBF9F8;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:32px">
            <tr>
              <td>
                <p style="margin:0 0 24px"><img src="{{ .SiteURL }}/brand/mirhaba-logo-email.png" width="240" height="60" alt="Mirhaba" style="display:block;border:0;width:240px;height:60px" /></p>
                <p style="margin:0 0 8px;font-size:15px;color:#4A4550">Giriş kodun / Kodi yt i hyrjes</p>
                <p style="margin:0 0 24px;font-size:36px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
                <p style="margin:0 0 6px;font-size:15px">Bu kodu Mirhaba'da gir. Kod 1 saat geçerlidir.</p>
                <p lang="sq" style="margin:0 0 24px;font-size:15px">Shkruaje këtë kod në Mirhaba. Kodi vlen 1 orë.</p>
                <p style="margin:0;font-size:13px;color:#4A4550">
                  Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin.<br />
                  <span lang="sq">Nëse nuk e ke kërkuar ti, injoroje këtë email.</span>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
